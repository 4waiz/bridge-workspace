name: Build Server Image (GHCR)

# Builds the BRIDGE Flow backend server into a Docker image and pushes it to
# GitHub Container Registry (GHCR). Single-arch (linux/amd64 — what almost every
# VPS runs). Trigger it manually from the Actions tab.
#
# Output image:  ghcr.io/${{ github.repository_owner }}/bridge-flow:latest
# Make the package public once after the first run:
#   GitHub → your profile → Packages → bridge-flow → Package settings → Change visibility → Public

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        type: string
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  APP_VERSION: 0.26.3
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build-server-native:
    name: Build server native (amd64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ env.APP_VERSION }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @bridgeflow/server-native
      - name: Build Rust native
        uses: ./.github/actions/build-rust
        with:
          target: ${{ env.TARGET }}
          package: '@bridgeflow/server-native'
      - name: Rename native binding
        run: mv ./packages/backend/native/server-native.node ./packages/backend/native/server-native.x64.node
      - name: Upload native binding
        uses: actions/upload-artifact@v4
        with:
          name: server-native
          path: ./packages/backend/native/server-native.x64.node
          if-no-files-found: error

  build-server:
    name: Build server bundle
    runs-on: ubuntu-latest
    needs: build-server-native
    steps:
      - uses: actions/checkout@v6
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ env.APP_VERSION }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @bridgeflow/server @types/bridgeflow__env
      - name: Download native binding
        uses: actions/download-artifact@v4
        with:
          name: server-native
          path: ./packages/backend/native
      - name: Build server
        run: yarn workspace @bridgeflow/server build
      - name: Upload server dist
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: ./packages/backend/server/dist
          if-no-files-found: error

  build-web:
    name: Build web frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ env.APP_VERSION }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Build web
        run: yarn bridgeflow @bridgeflow/web build
      - name: Upload web
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: ./packages/frontend/apps/web/dist
          if-no-files-found: error

  build-admin:
    name: Build admin frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ env.APP_VERSION }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Build admin
        run: yarn bridgeflow @bridgeflow/admin build
      - name: Upload admin
        uses: actions/upload-artifact@v4
        with:
          name: admin
          path: ./packages/frontend/admin/dist
          if-no-files-found: error

  build-mobile:
    name: Build mobile frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ env.APP_VERSION }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Build mobile
        run: yarn bridgeflow @bridgeflow/mobile build
      - name: Upload mobile
        uses: actions/upload-artifact@v4
        with:
          name: mobile
          path: ./packages/frontend/apps/mobile/dist
          if-no-files-found: error

  build-image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs:
      - build-server
      - build-web
      - build-admin
      - build-mobile
    steps:
      - uses: actions/checkout@v6
      - name: Download server dist
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: ./packages/backend/server/dist
      - name: Download web
        uses: actions/download-artifact@v4
        with:
          name: web
          path: ./packages/frontend/apps/web/dist
      - name: Download admin
        uses: actions/download-artifact@v4
        with:
          name: admin
          path: ./packages/frontend/admin/dist
      - name: Download mobile
        uses: actions/download-artifact@v4
        with:
          name: mobile
          path: ./packages/frontend/apps/mobile/dist
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Setup Node.js (no cache)
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Install production dependencies
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @bridgeflow/server --production
      - name: Generate Prisma client
        run: yarn workspace @bridgeflow/server prisma generate
      - name: Move node_modules into server
        run: mv ./node_modules ./packages/backend/server
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ env.APP_VERSION }}
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          file: .github/deployment/node/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/bridge-flow:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/bridge-flow:${{ github.sha }}
