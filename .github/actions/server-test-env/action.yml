name: 'Prepare Server Test Environment'
description: 'Prepare Server Test Environment'

runs:
  using: 'composite'
  steps:
    - name: Initialize database
      shell: bash
      run: |
        psql -h localhost -U postgres -c "CREATE DATABASE bridgeflow;"
        psql -h localhost -U postgres -c "CREATE USER bridgeflow WITH PASSWORD 'bridgeflow';"
        psql -h localhost -U postgres -c "ALTER USER bridgeflow WITH SUPERUSER;"
      env:
        PGPASSWORD: bridgeflow

    - name: Run init-db script
      shell: bash
      env:
        NODE_ENV: test
      run: |
        yarn bridgeflow @bridgeflow/server prisma generate
        yarn bridgeflow @bridgeflow/server prisma migrate deploy
        yarn bridgeflow @bridgeflow/server data-migration run

    - name: Import config
      shell: bash
      env:
        DEFAULT_CONFIG: '{}'
      run: |
        printf '%s\n' "${SERVER_CONFIG:-$DEFAULT_CONFIG}" > ./packages/backend/server/config.json
