# Cloudflare Workers (static assets) config for BRIDGE Flow.
#
# Deployed via Workers Builds (GitHub) on the bridgeae.com account:
#   Build command:  bash scripts/cf-pages-build.sh
#   Deploy command: npx wrangler deploy
#
# The build produces packages/frontend/apps/web/dist (the web app only, with the
# oversized Typst wasm + sourcemaps stripped). This Worker serves that folder as
# static assets with SPA fallback, so no Worker script (`main`) is needed.
#
# Build env vars to set in the project (skip the heavy Rust postinstall + husky):
#   YARN_ENABLE_SCRIPTS = false
#   HUSKY               = 0

compatibility_date = "2026-06-29"
name               = "bridge-workspace"

[assets]
directory = "./packages/frontend/apps/web/dist"
# serve index.html (200) for any unmatched route — required for a client-side SPA
not_found_handling = "single-page-application"
